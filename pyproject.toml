[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esmrank"
version = "0.1.1"
description = "A learn-to-rank approach for protein variant effect prediction"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# only the code license ships in the package; the model weights have their own (LICENSE_WEIGHTS.md)
license-files = ["LICENSE"]
authors = [
    { name = "Riccardo Arnese" },
    { name = "Gennaro Gambardella" },
]
keywords = ["protein", "variant effect prediction", "learning to rank", "protein language model", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Ranges around the versions in requirements.txt (the tested set). torch is left
# unpinned so you can install the build that matches your CUDA setup first.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "tqdm>=4.66",
    "xgboost>=2.1,<3",
    "edlib>=1.3.9",
    "pyhmmer>=0.11,<0.12",
    "biopython>=1.85",
    "transformers>=4.57,<5",
    "torch>=2.1",
    "accelerate>=0.26.0",
    "matplotlib",
    "pyarrow",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/gambalab/ESMRank"
Issues = "https://github.com/gambalab/ESMRank/issues"

[project.scripts]
esmrank = "esmrank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esmrank = ["data/*.csv"]
